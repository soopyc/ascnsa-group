{% extends "base.html" %}
{% block body %}
    <div class="container mt-5">
        <h1>Add New Book</h1>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3">
                <label>Title *</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>ISBN *</label>
                <input type="text" name="isbn" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Type *</label>
                <input type="text" name="type" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Author Name *</label>
                <input type="text" name="author_name" class="form-control" required>
            </div>
            <!-- ... rest of your form ... -->
            <button type="submit" class="btn btn-primary me-2">Create Book</button>
            <a href="{{ url_for('books.books_list') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
