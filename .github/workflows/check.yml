name: Lint project

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Install Project
        run: pdm install

      - name: Run Checks
        run: |
          just check
