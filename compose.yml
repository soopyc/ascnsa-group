services:
  db:
    image: mariadb:12
    volumes:
      - db-data:/var/lib/mysql
      - "./database setup:/docker-entrypoint-initdb.d:ro"
    environment:
      MARIADB_DATABASE: library_app
      MARIADB_USER: user
      MARIADB_PASSWORD: userresu
      MARIADB_RANDOM_ROOT_PASSWORD: true
    ports:
       - 3306:3306
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-u", "user", "-puserresu"]
      timeout: 2s
      retries: 60
  app:
    build: .
    environment:
      DATABASE: library_app
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: userresu
    depends_on:
      db:
        condition: service_healthy

    ports:
      - 8000:8000

volumes:
  db-data:
