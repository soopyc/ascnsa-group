[project]
name = "library-app"
version = "0.1.0"
description = "Default template for PDM package"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=23.0.0",
    "mysql-connector-python>=9.4.0",
    "pymysql>=1.1.2",
]
authors = [
    {name = "soopyc", email = "hwc39103@uowmail.edu.au"},
]
license = {text = "MIT"}

[tool.pdm]
distribution = false

[tool.pyright]
reportUnsupportedDunderAll = false

[tool.ruff.format]
indent-style = "tab"

[tool.djlint]
profile="jinja"

[dependency-groups]
dev = [
    "ruff>=0.14.7",
]
